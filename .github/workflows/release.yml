name: Release

# A tag is the only thing that can start a release. Pushing to main does not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, without the leading v'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify before packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:node
      - run: npm test
      - run: npm run build
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v='${{ inputs.version }}'
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          # The key here must be "version": it is what the job output below and
          # both downstream jobs read. Writing any other key leaves the output
          # empty, and an empty version silently becomes the tag "v".
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version $v"

  package:
    name: Build Dentiva-Pro-Setup.exe
    needs: verify
    # Windows, because NSIS and the Electron Windows build are Windows tools.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set the version
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" -replace '^v', '' }
          # An empty version reaches package.json and then into the packaged
          # application, where it is the build number a clinic is given when
          # they ask for support. Stop here rather than after 20 minutes.
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Error '::error::No version could be resolved from the tag or the workflow input.'
            exit 1
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            Write-Error "::error::'$v' is not a version number (expected MAJOR.MINOR.PATCH)."
            exit 1
          }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = $v
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
          Write-Host "Packaging version $v"

      - run: npm ci
      - run: npm run build

      - name: Prepare the release artefacts
        run: node scripts/package-release.mjs

      # The notices and the build manifest belong in the installer output
      # directory, because that directory is what gets uploaded and attached to
      # the release. They are written to the repository root by the script,
      # since a source archive has no release/ directory to write into.
      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($f in @('THIRD-PARTY-NOTICES.txt', 'build-manifest.json')) {
            if (-not (Test-Path $f)) {
              Write-Error "::error::$f was not produced by the release preparation"
              exit 1
            }
            Copy-Item $f release -Force
          }
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      # The run log is not always retrievable after a run, so a build failure
      # is also raised as an annotation, which always is.
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath builder.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content builder.log -Tail 40) -join "`n"
            Write-Host "::error title=electron-builder failed (exit $code)::$($tail -replace "`r?`n", '%0A')"
            Write-Host "::error title=electron-builder output::see the build log attached to this run"
          }
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'release\Dentiva-Pro-Setup.exe'
          if (-not (Test-Path $installer)) {
            Write-Error "::error::$installer was not produced"
            exit 1
          }
          $item = Get-Item $installer
          if ($item.Length -lt 40MB) {
            Write-Error "::error::the installer is only $([math]::Round($item.Length/1MB,1)) MB, which cannot contain Chromium"
            exit 1
          }
          Write-Host "Installer: $($item.Name) — $([math]::Round($item.Length/1MB,1)) MB"
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Check the installer is a Windows PE executable
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('release\Dentiva-Pro-Setup.exe')[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error '::error::Dentiva-Pro-Setup.exe is not a Windows executable'
            exit 1
          }
          Write-Host 'MZ header confirmed.'

      - name: Record the SHA-256 of the installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'release\Dentiva-Pro-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "sha256  Dentiva-Pro-Setup.exe" | Out-File 'release\Dentiva-Pro-Setup.exe.sha256' -Encoding utf8
          "version=${{ needs.verify.outputs.version }}" | Out-File 'release\release-info.txt' -Encoding utf8 -Append
          "built=$((Get-Date).ToUniversalTime().ToString('o'))" | Out-File 'release\release-info.txt' -Encoding utf8 -Append
          "commit=${{ github.sha }}" | Out-File 'release\release-info.txt' -Encoding utf8 -Append
          "sha256=$hash" | Out-File 'release\release-info.txt' -Encoding utf8 -Append
          Write-Host "sha256: $hash"

      - name: Upload the installer as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dentiva-Pro-Setup
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload the builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-log
          path: |
            release/
            builder.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish the GitHub Release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Dentiva-Pro-Setup
          path: release

      - name: Create the release and attach the installer
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          # The tag is the trigger, so the release must land on the tag that
          # already exists. Writing "1.0.0" here would create a second, untagged
          # release next to it.
          tag_name: v${{ needs.verify.outputs.version }}
          name: Dentiva Pro ${{ needs.verify.outputs.version }}
          body: |
            Dentiva Pro ${{ needs.verify.outputs.version }}

            Windows installer: **Dentiva-Pro-Setup.exe** (x64)

            Verify the download before installing:

            ```
            Get-FileHash .\Dentiva-Pro-Setup.exe -Algorithm SHA256
            ```

            The SHA-256 for this build is in `Dentiva-Pro-Setup.exe.sha256` and
            `release-info.txt`, attached alongside.

            Dentiva Pro is an offline desktop application for dental clinics. It
            makes no network connections at runtime and holds patient data only
            on the clinic's own computer.
          files: |
            release/Dentiva-Pro-Setup.exe
            release/Dentiva-Pro-Setup.exe.sha256
            release/release-info.txt
            release/THIRD-PARTY-NOTICES.txt
            release/build-manifest.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}

      # A green run must mean a real, correctly-tagged release with the
      # installer on it. An empty version once produced a release on the tag
      # "v" that nobody would ever find, and the run was green.
      - name: Confirm the release exists and carries the installer
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version='${{ needs.verify.outputs.version }}'
          tag="v${version}"

          if [ -z "$version" ]; then
            echo "::error title=No version was resolved::The verify job passed no version, so there is no tag to publish to. The installer is on this run's artefacts."
            exit 1
          fi

          if ! gh release view "$tag" --json tagName,isDraft,isPrerelease,url \
               --jq '"tag: \(.tagName)  draft: \(.isDraft)  prerelease: \(.isPrerelease)", "url: \(.url)"'; then
            echo "::error title=No release on the expected tag::$tag does not exist. The installer is on this run's artefacts."
            exit 1
          fi

          names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for required in Dentiva-Pro-Setup.exe Dentiva-Pro-Setup.exe.sha256 release-info.txt; do
            if ! printf '%s\n' "$names" | grep -qx "$required"; then
              echo "::error title=The release is missing a file::$required is not attached to $tag"
              exit 1
            fi
          done

          echo "::group::Assets on $tag"
          gh release view "$tag" --json assets --jq '.assets[] | "  \(.name)  \((.size/1048576*100|floor)/100) MB"'
          echo "::endgroup::"
          echo "Published $tag with $(printf '%s\n' "$names" | wc -l) files."
