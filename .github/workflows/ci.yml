name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Audit the production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck the interface and the core
        run: npm run typecheck

      - name: Typecheck the main process and the scripts
        run: npm run typecheck:node

      - name: Run the test suite
        run: npm test

      - name: Build the renderer and the core
        run: npm run build

      - name: Prepare the release artefacts
        run: node scripts/package-release.mjs

      - name: Confirm the Bengali font reached the bundle
        run: |
          set -euo pipefail
          if ! ls dist/renderer/assets/ | grep -q 'bengali.*\.woff2$'; then
            echo "::error::no Noto Sans Bengali subset in the renderer bundle"
            exit 1
          fi
          if ! ls dist/renderer/assets/ | grep -q '^inter.*\.woff2$'; then
            echo "::error::no Inter subset in the renderer bundle"
            exit 1
          fi
          ls -la dist/renderer/assets/ | grep -E 'bengali|inter' | head -20

      - name: Confirm no activation material entered the build
        run: |
          set -euo pipefail
          if grep -rEil "activation[_-]?(code|key)\s*[:=]\s*['\"][0-9A-Za-z-]{8,}['\"]" dist out; then
            echo "::error::a possible activation literal was found in the build output"
            exit 1
          fi
          echo "No activation literal in dist/ or out/."

      - name: Load profile at a reduced size
        run: npm run stress -- --patients 1500 --invoices 4000

      - name: Upload the diagnostics bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preparation
          path: |
            THIRD-PARTY-NOTICES.txt
            build-manifest.json
          if-no-files-found: warn
          retention-days: 30
